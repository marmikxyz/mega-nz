<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marmik Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1115;
    --panel: #171a21;
    --panel-hover: #1f232c;
    --line: #262b35;
    --text: #eef1f7;
    --muted: #8b93a7;
    --accent: #f2b134;
    --accent-dim: #7a5c1c;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
  }

  /* Top bar */
  header{
    display:flex;
    align-items:center;
    gap:24px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top:0;
    background: rgba(15,17,21,0.92);
    backdrop-filter: blur(8px);
    z-index: 20;
  }
  .logo{
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
    white-space: nowrap;
    display:flex;
    align-items:center;
    gap:8px;
    cursor: pointer;
  }
  .logo span{ color: var(--accent); }
  .logo::before{
    content:"";
    display:inline-block;
    width:10px; height:10px;
    background: var(--accent);
    border-radius: 2px;
    transform: rotate(45deg);
  }

  .search-wrap{
    flex: 1;
    max-width: 560px;
    display:flex;
  }
  .search-wrap input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px 0 0 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-wrap input::placeholder{ color: var(--muted); }
  .search-wrap input:focus{ border-color: var(--accent); }
  .search-btn{
    background: var(--accent);
    border: none;
    border-radius: 0 8px 8px 0;
    padding: 0 18px;
    cursor: pointer;
    color: #14161c;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .search-btn:hover{ background: #ffc65a; }

  main{
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 28px 60px;
  }

  /* Player overlay (shown when a video is selected) */
  #playerSection{
    display: none;
    margin-bottom: 28px;
  }
  #playerSection.visible{ display: block; }

  .back-link{
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .back-link:hover{ color: var(--text); }

  .player-frame{
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .player-frame iframe{
    width: 100%; height: 100%; border: none;
  }
  .now-playing-title{
    font-size: 19px;
    font-weight: 800;
    margin: 16px 0 4px;
    max-width: 960px;
  }
  .now-playing-meta{
    color: var(--muted);
    font-size: 13px;
  }

  /* Grid */
  .grid-title{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 4px 0 16px;
  }
  .video-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .video-card{
    cursor: pointer;
    border-radius: 10px;
    overflow: hidden;
  }
  .thumb{
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 10px;
    background: linear-gradient(135deg, #232838, #171a21);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    font-size: 28px;
    position: relative;
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .video-card:hover .thumb{ border-color: var(--accent-dim); }
  .thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb .dur{
    position:absolute;
    bottom:6px; right:6px;
    background: rgba(0,0,0,0.8);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text);
  }
  .card-meta{
    padding: 10px 2px 0;
  }
  .card-meta .t{
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta .s{
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }

  .empty-state{
    color: var(--muted);
    font-size: 14px;
    padding: 20px 2px;
    grid-column: 1 / -1;
  }

  @media (max-width: 600px){
    header{ gap: 14px; padding: 12px 16px; }
    .logo{ font-size: 18px; }
    main{ padding: 18px 16px 50px; }
    .video-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">Marmik <span>Archive</span></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search videos...">
    <button class="search-btn" onclick="runSearch()">Search</button>
  </div>
</header>

<main>
  <div id="playerSection">
    <div class="back-link" onclick="goHome()">&#8592; Back to all videos</div>
    <div class="player-frame" id="playerFrame"></div>
    <div class="now-playing-title" id="npTitle"></div>
    <div class="now-playing-meta" id="npMeta"></div>
  </div>

  <div class="grid-title">Videos</div>
  <div class="video-grid" id="videoGrid"></div>
</main>

<script>
  /* =========================================================
     ADD YOUR VIDEOS HERE.
     - title: shown as the video name
     - embed: your Mega embed link
         take your share link:  https://mega.nz/file/XXXXX#YYYYY
         change /file/ to /embed/:  https://mega.nz/embed/XXXXX#YYYYY
     - duration: optional text shown on the thumbnail (e.g. "12:34")
     - thumbnail: optional image URL for the thumbnail. Leave as "" to show
                  a default play-icon placeholder instead.
     ========================================================= */
  const videos = [
    {
      title: "india got latent",
      embed: "https://mega.nz/embed/blxDHIIC#xtl6jlJYJXoxunocRyR26GyNcI7iC5rwkqx0sBip_jQ",
      duration: "10:00",
      thumbnail: "https://i.ibb.co/JFQS7zJ8/x.jpg"
    },
    {
      title: "Karuppu",
      embed: "https://mega.nz/embed/P9I1XZRT#XavVPD_b8-j6CvgcId4WLTJjJXxMHtztpSfIoeCbXGA",
      duration: "05:24",
      thumbnail: "https://i.ibb.co/Bxp4nfL/x.jpg"
    },
    {
      title: "Sample Video 3",
      embed: "https://mega.nz/embed/AbCdEfGh3#XyZ123keyHere3",
      duration: "22:11",
      thumbnail: ""
    }
  ];

  const gridEl = document.getElementById('videoGrid');
  const playerSection = document.getElementById('playerSection');
  const playerFrame = document.getElementById('playerFrame');
  const npTitle = document.getElementById('npTitle');
  const npMeta = document.getElementById('npMeta');

  function render(list){
    gridEl.innerHTML = '';
    if(list.length === 0){
      gridEl.innerHTML = '<div class="empty-state">No videos match your search.</div>';
      return;
    }
    list.forEach((v) => {
      const realIndex = videos.indexOf(v);
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => playVideo(realIndex);

      const thumbContent = v.thumbnail
        ? `<img src="${v.thumbnail}" alt="${v.title}" onerror="this.outerHTML='&#9654;';">`
        : `&#9654;`;

      card.innerHTML = `
        <div class="thumb">${thumbContent}<span class="dur">${v.duration || ''}</span></div>
        <div class="card-meta">
          <div class="t">${v.title}</div>
          <div class="s">Marmik Archive</div>
        </div>
      `;
      gridEl.appendChild(card);
    });
  }

  function playVideo(index){
    const v = videos[index];
    playerFrame.innerHTML = `<iframe src="${v.embed}" allowfullscreen allow="autoplay"></iframe>`;
    npTitle.textContent = v.title;
    npMeta.textContent = 'Now playing';
    playerSection.classList.add('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goHome(){
    playerSection.classList.remove('visible');
    playerFrame.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  let lastQuery = '';
  function currentFiltered(){
    if(!lastQuery) return videos;
    return videos.filter(v => v.title.toLowerCase().includes(lastQuery));
  }

  function runSearch(){
    lastQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    render(currentFiltered());
  }

  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch();
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    lastQuery = e.target.value.trim().toLowerCase();
    render(currentFiltered());
  });

  render(videos);
</script>

</body>
</html>

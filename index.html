<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVK Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f1115;
    --panel: #171a21;
    --panel-hover: #1f232c;
    --line: #262b35;
    --text: #eef1f7;
    --muted: #8b93a7;
    --accent: #f2b134;
    --accent-dim: #7a5c1c;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
  }

  /* Top bar */
  header{
    display:flex;
    align-items:center;
    gap:24px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top:0;
    background: rgba(15,17,21,0.92);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  .logo{
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--text);
    white-space: nowrap;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo span{ color: var(--accent); }
  .logo::before{
    content:"";
    display:inline-block;
    width:10px; height:10px;
    background: var(--accent);
    border-radius: 2px;
    transform: rotate(45deg);
  }

  .search-wrap{
    flex: 1;
    max-width: 560px;
    display:flex;
  }
  .search-wrap input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px 0 0 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-wrap input::placeholder{ color: var(--muted); }
  .search-wrap input:focus{ border-color: var(--accent); }
  .search-btn{
    background: var(--accent);
    border: none;
    border-radius: 0 8px 8px 0;
    padding: 0 18px;
    cursor: pointer;
    color: #14161c;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .search-btn:hover{ background: #ffc65a; }

  /* Layout */
  main{
    display:flex;
    gap: 28px;
    padding: 24px 28px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .player-col{ flex: 2; min-width: 0; }
  .list-col{ flex: 1; min-width: 300px; }

  .player-frame{
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .player-frame iframe{
    width: 100%; height: 100%; border: none;
  }
  .player-placeholder{
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color: var(--muted);
    text-align:center;
    padding: 0 20px;
  }
  .player-placeholder .glyph{
    width: 56px; height:56px;
    border-radius: 50%;
    border: 2px solid var(--accent-dim);
    display:flex; align-items:center; justify-content:center;
    font-size: 22px; color: var(--accent);
  }

  .now-playing-title{
    font-size: 19px;
    font-weight: 800;
    margin: 16px 0 4px;
  }
  .now-playing-meta{
    color: var(--muted);
    font-size: 13px;
  }

  /* Video list */
  .list-title{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 4px 0 14px;
  }
  .video-card{
    display:flex;
    gap: 12px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 6px;
    border: 1px solid transparent;
  }
  .video-card:hover{ background: var(--panel-hover); }
  .video-card.active{
    background: var(--panel);
    border-color: var(--accent-dim);
  }
  .thumb{
    width: 120px;
    aspect-ratio: 16/9;
    flex-shrink: 0;
    border-radius: 6px;
    background: linear-gradient(135deg, #232838, #171a21);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    font-size: 20px;
    position: relative;
    overflow:hidden;
  }
  .thumb .dur{
    position:absolute;
    bottom:4px; right:4px;
    background: rgba(0,0,0,0.75);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--text);
  }
  .card-meta{ min-width:0; }
  .card-meta .t{
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta .s{
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .empty-state{
    color: var(--muted);
    font-size: 14px;
    padding: 20px 8px;
  }

  @media (max-width: 880px){
    main{ flex-direction: column; }
    header{ gap: 14px; }
    .logo{ font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">MVK <span>Player</span></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search videos...">
    <button class="search-btn" onclick="runSearch()">Search</button>
  </div>
</header>

<main>
  <div class="player-col">
    <div class="player-frame" id="playerFrame">
      <div class="player-placeholder">
        <div class="glyph">&#9654;</div>
        <div>Select a video from the list to start playing</div>
      </div>
    </div>
    <div class="now-playing-title" id="npTitle"></div>
    <div class="now-playing-meta" id="npMeta"></div>
  </div>

  <div class="list-col">
    <div class="list-title">Videos</div>
    <div id="videoList"></div>
  </div>
</main>

<script>
  /* =========================================================
     ADD YOUR VIDEOS HERE.
     - title: shown as the video name
     - embed: your Mega embed link
         take your share link:  https://mega.nz/file/XXXXX#YYYYY
         change /file/ to /embed/:  https://mega.nz/embed/XXXXX#YYYYY
     - duration: optional text shown on the thumbnail (e.g. "12:34")
     ========================================================= */
  const videos = [
    {
      title: "Sample Video 1",
      embed: "https://mega.nz/embed/blxDHIIC#xtl6jlJYJXoxunocRyR26GyNcI7iC5rwkqx0sBip_jQ",
      duration: "10:00"
    },
    {
      title: "Sample Video 2",
      embed: "https://mega.nz/embed/AbCdEfGh2#XyZ123keyHere2",
      duration: "05:24"
    },
    {
      title: "Sample Video 3",
      embed: "https://mega.nz/embed/AbCdEfGh3#XyZ123keyHere3",
      duration: "22:11"
    }
  ];

  const listEl = document.getElementById('videoList');
  const playerFrame = document.getElementById('playerFrame');
  const npTitle = document.getElementById('npTitle');
  const npMeta = document.getElementById('npMeta');
  let activeIndex = null;

  function render(list){
    listEl.innerHTML = '';
    if(list.length === 0){
      listEl.innerHTML = '<div class="empty-state">No videos match your search.</div>';
      return;
    }
    list.forEach((v) => {
      const realIndex = videos.indexOf(v);
      const card = document.createElement('div');
      card.className = 'video-card' + (realIndex === activeIndex ? ' active' : '');
      card.onclick = () => playVideo(realIndex);
      card.innerHTML = `
        <div class="thumb">&#9654;<span class="dur">${v.duration || ''}</span></div>
        <div class="card-meta">
          <div class="t">${v.title}</div>
          <div class="s">MVK Player</div>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function playVideo(index){
    activeIndex = index;
    const v = videos[index];
    playerFrame.innerHTML = `<iframe src="${v.embed}" allowfullscreen allow="autoplay"></iframe>`;
    npTitle.textContent = v.title;
    npMeta.textContent = 'Now playing';
    render(currentFiltered());
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  let lastQuery = '';
  function currentFiltered(){
    if(!lastQuery) return videos;
    return videos.filter(v => v.title.toLowerCase().includes(lastQuery));
  }

  function runSearch(){
    lastQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    render(currentFiltered());
  }

  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch();
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    lastQuery = e.target.value.trim().toLowerCase();
    render(currentFiltered());
  });

  render(videos);
</script>

</body>
</html>

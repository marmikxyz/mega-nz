<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marmik Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #170f0a;
    --panel: #241811;
    --panel-hover: #2e1f15;
    --line: #3a2a1c;
    --text: #f5ead9;
    --muted: #b89a7d;
    --saffron: #ff9933;
    --saffron-dim: #8a531c;
    --gold: #e8c37a;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    position: relative;
  }

  /* Subtle watermark of Shiva behind everything */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('https://iili.io/C8yaMR1.jpg');
    background-size: 480px;
    background-repeat: no-repeat;
    background-position: center 60px;
    opacity: 0.05;
    filter: grayscale(30%);
    pointer-events: none;
    z-index: 0;
  }

  /* Top bar */
  header{
    display:flex;
    align-items:center;
    gap:20px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top:0;
    background: rgba(23,15,10,0.92);
    backdrop-filter: blur(8px);
    z-index: 20;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .shiva-avatar{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--saffron);
    box-shadow: 0 0 12px 2px rgba(255,153,51,0.55), 0 0 24px 4px rgba(255,153,51,0.25);
  }
  .logo{
    font-family: 'Cinzel', serif;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--text);
    line-height: 1.1;
  }
  .logo span{ color: var(--saffron); }
  .tagline{
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .search-wrap{
    flex: 1;
    max-width: 520px;
    display:flex;
    margin-left: auto;
  }
  .search-wrap input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px 0 0 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-wrap input::placeholder{ color: var(--muted); }
  .search-wrap input:focus{ border-color: var(--saffron); }
  .search-btn{
    background: var(--saffron);
    border: none;
    border-radius: 0 8px 8px 0;
    padding: 0 18px;
    cursor: pointer;
    color: #1a0f08;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .search-btn:hover{ background: var(--gold); }

  main{
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 28px 60px;
    position: relative;
    z-index: 1;
  }

  /* Om divider */
  .om-divider{
    text-align: center;
    color: var(--saffron-dim);
    font-size: 20px;
    margin: 0 0 20px;
    letter-spacing: 10px;
  }

  /* Player section */
  #playerSection{ display: none; margin-bottom: 28px; }
  #playerSection.visible{ display: block; }

  .back-link{
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .back-link:hover{ color: var(--saffron); }

  .player-frame{
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--saffron-dim);
    box-shadow: 0 0 30px rgba(255,153,51,0.12);
  }
  .player-frame iframe{ width: 100%; height: 100%; border: none; }

  .now-playing-title{
    font-size: 19px;
    font-weight: 800;
    margin: 16px 0 4px;
    max-width: 960px;
    font-family: 'Cinzel', serif;
  }
  .now-playing-meta{ color: var(--muted); font-size: 13px; }

  /* Grid */
  .grid-title{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--saffron-dim);
    margin: 4px 0 16px;
    font-weight: 800;
  }
  .video-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .video-card{ cursor: pointer; border-radius: 10px; overflow: hidden; }
  .thumb{
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 10px;
    background: linear-gradient(135deg, #2e1f15, #1a1109);
    display:flex; align-items:center; justify-content:center;
    color: var(--saffron);
    font-size: 28px;
    position: relative;
    overflow:hidden;
    border: 1px solid var(--line);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .video-card:hover .thumb{
    border-color: var(--saffron);
    box-shadow: 0 0 16px rgba(255,153,51,0.25);
  }
  .thumb img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur{
    position:absolute;
    bottom:6px; right:6px;
    background: rgba(0,0,0,0.8);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text);
  }
  .thumb .src-tag{
    position:absolute;
    top:6px; left:6px;
    background: rgba(255,153,51,0.9);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    color: #1a0f08;
  }
  .card-meta{ padding: 10px 2px 0; }
  .card-meta .t{
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta .s{ font-size: 12px; color: var(--muted); margin-top: 3px; }

  .empty-state{
    color: var(--muted);
    font-size: 14px;
    padding: 20px 2px;
    grid-column: 1 / -1;
  }

  footer{
    text-align:center;
    padding: 24px;
    color: var(--saffron-dim);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 600px){
    header{ gap: 12px; padding: 12px 16px; }
    .logo{ font-size: 17px; }
    .tagline{ display:none; }
    main{ padding: 18px 16px 50px; }
    .video-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="goHome()">
    <img class="shiva-avatar" src="https://iili.io/C8yaMR1.jpg" alt="Shiva">
    <div>
      <div class="logo">ॐ Marmik <span>Player</span></div>
      <div class="tagline">Har Har Mahadev</div>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search videos...">
    <button class="search-btn" onclick="runSearch()">Search</button>
  </div>
</header>

<main>
  <div id="playerSection">
    <div class="back-link" onclick="goHome()">&#8592; Back to all videos</div>
    <div class="player-frame" id="playerFrame"></div>
    <div class="now-playing-title" id="npTitle"></div>
    <div class="now-playing-meta" id="npMeta"></div>
  </div>

  <div class="om-divider">&#3350;</div>
  <div class="grid-title">Videos</div>
  <div class="video-grid" id="videoGrid"></div>
</main>

<footer>ॐ नमः शिवाय</footer>

<script>
  /* =========================================================
     ADD YOUR VIDEOS HERE.

     type: "mega" | "youtube" | "dailymotion"

     For MEGA:
       url = your embed link (take the share link and change
             /file/ to /embed/), e.g.
             https://mega.nz/embed/AbCdEfGh#XyZ123keyHere
       Note: Mega's embed player does not support a start-time
       parameter, so "startTime" is ignored for mega videos.

     For YOUTUBE:
       url = any normal link works: watch?v=..., youtu.be/...,
             or an embed link. The ID is auto-extracted.

     For DAILYMOTION:
       url = any normal link works: dailymotion.com/video/...
             or an embed link. The ID is auto-extracted.

     startTime: optional, number of SECONDS into the video to
                start playback (YouTube & Dailymotion only).

     thumbnail: optional image URL. Leave "" for a default icon.
     duration: optional text shown on the thumbnail (e.g. "12:34")
     ========================================================= */
  const videos = [
    {
      title: "india got latent",
      type: "mega",
      url: "https://mega.nz/embed/blxDHIIC#xtl6jlJYJXoxunocRyR26GyNcI7iC5rwkqx0sBip_jQ",
      duration: "57:14",
      thumbnail: "https://i.ibb.co/JFQS7zJ8/x.jpg"
    },
    {
      title: "test",
      type: "youtube",
      url: "https://www.youtube.com/watch?v=dQw4w9WgXc",
      startTime: 30,
      duration: "05:24",
      thumbnail: ""
    },
    {
      title: "test 2",
      type: "dailymotion",
      url: "https://www.dailymotion.com/video/x7tgd2v",
      startTime: 15,
      duration: "22:11",
      thumbnail: ""
    }
  ];

  const gridEl = document.getElementById('videoGrid');
  const playerSection = document.getElementById('playerSection');
  const playerFrame = document.getElementById('playerFrame');
  const npTitle = document.getElementById('npTitle');
  const npMeta = document.getElementById('npMeta');

  function extractYouTubeId(url){
    const patterns = [
      /youtu\.be\/([^?&/]+)/,
      /youtube\.com\/watch\?v=([^&]+)/,
      /youtube\.com\/embed\/([^?&/]+)/,
      /youtube\.com\/shorts\/([^?&/]+)/
    ];
    for(const p of patterns){
      const m = url.match(p);
      if(m) return m[1];
    }
    return null;
  }

  function extractDailymotionId(url){
    const patterns = [
      /dailymotion\.com\/video\/([^_?&/]+)/,
      /dailymotion\.com\/embed\/video\/([^_?&/]+)/,
      /dai\.ly\/([^_?&/]+)/
    ];
    for(const p of patterns){
      const m = url.match(p);
      if(m) return m[1];
    }
    return null;
  }

  function buildEmbedSrc(v){
    if(v.type === 'youtube'){
      const id = extractYouTubeId(v.url);
      let src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      if(v.startTime) src += `&start=${v.startTime}`;
      return src;
    }
    if(v.type === 'dailymotion'){
      const id = extractDailymotionId(v.url);
      let src = `https://www.dailymotion.com/embed/video/${id}?autoplay=1`;
      if(v.startTime) src += `&start=${v.startTime}`;
      return src;
    }
    // mega — used as-is, no start-time support
    return v.url;
  }

  function render(list){
    gridEl.innerHTML = '';
    if(list.length === 0){
      gridEl.innerHTML = '<div class="empty-state">No videos match your search.</div>';
      return;
    }
    list.forEach((v) => {
      const realIndex = videos.indexOf(v);
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => playVideo(realIndex);

      const thumbContent = v.thumbnail
        ? `<img src="${v.thumbnail}" alt="${v.title}" onerror="this.outerHTML='&#9654;';">`
        : `&#9654;`;

      card.innerHTML = `
        <div class="thumb">
          ${thumbContent}
          <span class="src-tag">${v.type}</span>
          <span class="dur">${v.duration || ''}</span>
        </div>
        <div class="card-meta">
          <div class="t">${v.title}</div>
          <div class="s">Marmik Player</div>
        </div>
      `;
      gridEl.appendChild(card);
    });
  }

  function playVideo(index){
    const v = videos[index];
    const src = buildEmbedSrc(v);
    playerFrame.innerHTML = `<iframe src="${src}" allowfullscreen allow="autoplay"></iframe>`;
    npTitle.textContent = v.title;
    npMeta.textContent = 'Now playing';
    playerSection.classList.add('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goHome(){
    playerSection.classList.remove('visible');
    playerFrame.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  let lastQuery = '';
  function currentFiltered(){
    if(!lastQuery) return videos;
    return videos.filter(v => v.title.toLowerCase().includes(lastQuery));
  }

  function runSearch(){
    lastQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    render(currentFiltered());
  }

  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch();
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    lastQuery = e.target.value.trim().toLowerCase();
    render(currentFiltered());
  });

  render(videos);
</script>

</body>
</html>

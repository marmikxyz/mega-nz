<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marmik Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0d;
    --panel: #161619;
    --panel-hover: #1f1f23;
    --line: #26262b;
    --text: #ececef;
    --muted: #8a8a92;
    --accent: #ffffff;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
  }

  header{
    display:flex;
    align-items:center;
    gap:20px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top:0;
    background: rgba(11,11,13,0.92);
    backdrop-filter: blur(8px);
    z-index: 20;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .om-avatar{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 20px;
    color: var(--text);
    flex-shrink: 0;
  }
  .logo{
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: var(--text);
    line-height: 1.1;
  }
  .tagline{
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .search-wrap{
    flex: 1;
    max-width: 520px;
    display:flex;
    margin-left: auto;
  }
  .search-wrap input{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px 0 0 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    outline: none;
  }
  .search-wrap input::placeholder{ color: var(--muted); }
  .search-wrap input:focus{ border-color: var(--accent); }
  .search-btn{
    background: var(--accent);
    border: none;
    border-radius: 0 8px 8px 0;
    padding: 0 18px;
    cursor: pointer;
    color: #0b0b0d;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  .search-btn:hover{ background: #d8d8db; }

  main{
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 28px 60px;
  }

  /* Playlist tabs */
  .tabs{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .tab{
    padding: 7px 16px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab:hover{ background: var(--panel-hover); color: var(--text); }
  .tab.active{
    background: var(--accent);
    color: #0b0b0d;
    border-color: var(--accent);
  }

  #playerSection{ display: none; margin-bottom: 28px; }
  #playerSection.visible{ display: block; }

  .back-link{
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .back-link:hover{ color: var(--text); }

  .player-frame{
    position: relative;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .player-frame iframe{ width: 100%; height: 100%; border: none; }

  .now-playing-title{
    font-size: 19px;
    font-weight: 800;
    margin: 16px 0 4px;
    max-width: 960px;
  }
  .now-playing-meta{ color: var(--muted); font-size: 13px; }

  .grid-title{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin: 4px 0 16px;
    font-weight: 800;
  }
  .video-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .video-card{ cursor: pointer; border-radius: 10px; overflow: hidden; }
  .thumb{
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 10px;
    background: var(--panel);
    display:flex; align-items:center; justify-content:center;
    color: var(--muted);
    font-size: 26px;
    position: relative;
    overflow:hidden;
    border: 1px solid var(--line);
    transition: border-color 0.15s;
  }
  .video-card:hover .thumb{ border-color: var(--accent); }
  .thumb img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur{
    position:absolute;
    bottom:6px; right:6px;
    background: rgba(0,0,0,0.8);
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text);
  }
  .thumb .src-tag{
    position:absolute;
    top:6px; left:6px;
    background: rgba(255,255,255,0.9);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
    color: #0b0b0d;
  }
  .card-meta{ padding: 10px 2px 0; }
  .card-meta .t{
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta .s{ font-size: 12px; color: var(--muted); margin-top: 3px; }

  .empty-state{
    color: var(--muted);
    font-size: 14px;
    padding: 20px 2px;
    grid-column: 1 / -1;
  }

  .load-error{
    color: var(--muted);
    font-size: 13px;
    padding: 20px 2px;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  footer{
    text-align:center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  @media (max-width: 600px){
    header{ gap: 12px; padding: 12px 16px; }
    .logo{ font-size: 16px; }
    main{ padding: 18px 16px 50px; }
    .video-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="goHome()">
    <div class="om-avatar">&#3350;</div>
    <div>
      <div class="logo">Marmik Player</div>
      <div class="tagline">Om</div>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search videos...">
    <button class="search-btn" onclick="runSearch()">Search</button>
  </div>
</header>

<main>
  <div id="playerSection">
    <div class="back-link" onclick="goHome()">&#8592; Back to all videos</div>
    <div class="player-frame" id="playerFrame"></div>
    <div class="now-playing-title" id="npTitle"></div>
    <div class="now-playing-meta" id="npMeta"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="grid-title" id="gridTitle">Videos</div>
  <div class="video-grid" id="videoGrid"></div>
</main>

<footer>Marmik Player</footer>

<script>
  /* =========================================================
     Videos live in videos.json, playlists live in playlists.json
     — both must sit in the SAME FOLDER as this HTML file.

     videos.json entry format:
       {
         "id": "v1",                 <- unique, used by playlists.json
         "title": "My Video",
         "type": "mega" | "youtube" | "dailymotion",
         "url": "...",                <- see notes below
         "startTime": 30,             <- optional, seconds (YT/DM only)
         "duration": "12:34",         <- optional, shown on thumbnail
         "thumbnail": "https://..."   <- optional image URL
       }

     For MEGA: url = embed link (share link with /file/ changed to /embed/)
     For YOUTUBE / DAILYMOTION: any normal link works, ID is auto-extracted.
     Note: Mega's player has no start-time support, so "startTime" is
     ignored for type "mega".

     playlists.json entry format:
       {
         "name": "My Favorites",
         "videoIds": ["v1", "v3"]   <- must match ids in videos.json, in order
       }

     IMPORTANT: because this page loads videos.json / playlists.json
     with fetch(), most browsers block that over a plain file:// link.
     Run it through a local server (e.g. `python3 -m http.server`) or
     deploy it (Vercel etc.) rather than double-clicking the html file.
     ========================================================= */

  let videos = [];
  let playlists = [];
  let currentPlaylistIndex = null; // null = "All Videos"
  let lastQuery = '';

  const gridEl = document.getElementById('videoGrid');
  const gridTitleEl = document.getElementById('gridTitle');
  const tabsEl = document.getElementById('tabs');
  const playerSection = document.getElementById('playerSection');
  const playerFrame = document.getElementById('playerFrame');
  const npTitle = document.getElementById('npTitle');
  const npMeta = document.getElementById('npMeta');

  async function loadData(){
    try{
      const [vRes, pRes] = await Promise.all([
        fetch('videos.json'),
        fetch('playlists.json')
      ]);
      videos = await vRes.json();
      playlists = await pRes.json();
      renderTabs();
      render(currentList());
    }catch(err){
      gridEl.innerHTML = `<div class="load-error">
        Could not load videos.json / playlists.json.<br>
        Make sure both files are in the same folder as this page, and
        that you're viewing it through a local server or a deployed
        URL (not a plain double-clicked file).
      </div>`;
    }
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    const allTab = document.createElement('div');
    allTab.className = 'tab' + (currentPlaylistIndex === null ? ' active' : '');
    allTab.textContent = 'All Videos';
    allTab.onclick = () => { currentPlaylistIndex = null; renderTabs(); render(currentList()); };
    tabsEl.appendChild(allTab);

    playlists.forEach((pl, i) => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (currentPlaylistIndex === i ? ' active' : '');
      tab.textContent = pl.name;
      tab.onclick = () => { currentPlaylistIndex = i; renderTabs(); render(currentList()); };
      tabsEl.appendChild(tab);
    });
  }

  function currentList(){
    let list;
    if(currentPlaylistIndex === null){
      list = videos;
      gridTitleEl.textContent = 'Videos';
    }else{
      const pl = playlists[currentPlaylistIndex];
      list = pl.videoIds.map(id => videos.find(v => v.id === id)).filter(Boolean);
      gridTitleEl.textContent = pl.name;
    }
    if(lastQuery){
      list = list.filter(v => v.title.toLowerCase().includes(lastQuery));
    }
    return list;
  }

  function extractYouTubeId(url){
    const patterns = [
      /youtu\.be\/([^?&/]+)/,
      /youtube\.com\/watch\?v=([^&]+)/,
      /youtube\.com\/embed\/([^?&/]+)/,
      /youtube\.com\/shorts\/([^?&/]+)/
    ];
    for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
    return null;
  }

  function extractDailymotionId(url){
    const patterns = [
      /dailymotion\.com\/video\/([^_?&/]+)/,
      /dailymotion\.com\/embed\/video\/([^_?&/]+)/,
      /dai\.ly\/([^_?&/]+)/
    ];
    for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
    return null;
  }

  function buildEmbedSrc(v){
    if(v.type === 'youtube'){
      const id = extractYouTubeId(v.url);
      let src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      if(v.startTime) src += `&start=${v.startTime}`;
      return src;
    }
    if(v.type === 'dailymotion'){
      const id = extractDailymotionId(v.url);
      let src = `https://www.dailymotion.com/embed/video/${id}?autoplay=1`;
      if(v.startTime) src += `&start=${v.startTime}`;
      return src;
    }
    return v.url; // mega — used as-is
  }

  function render(list){
    gridEl.innerHTML = '';
    if(!list || list.length === 0){
      gridEl.innerHTML = '<div class="empty-state">No videos here.</div>';
      return;
    }
    list.forEach((v) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => playVideo(v.id);

      const thumbContent = v.thumbnail
        ? `<img src="${v.thumbnail}" alt="${v.title}" onerror="this.outerHTML='&#9654;';">`
        : `&#9654;`;

      card.innerHTML = `
        <div class="thumb">
          ${thumbContent}
          <span class="src-tag">${v.type}</span>
          <span class="dur">${v.duration || ''}</span>
        </div>
        <div class="card-meta">
          <div class="t">${v.title}</div>
          <div class="s">Marmik Player</div>
        </div>
      `;
      gridEl.appendChild(card);
    });
  }

  function playVideo(id){
    const v = videos.find(x => x.id === id);
    if(!v) return;
    const src = buildEmbedSrc(v);
    playerFrame.innerHTML = `<iframe src="${src}" allowfullscreen allow="autoplay"></iframe>`;
    npTitle.textContent = v.title;
    npMeta.textContent = 'Now playing';
    playerSection.classList.add('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goHome(){
    playerSection.classList.remove('visible');
    playerFrame.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function runSearch(){
    lastQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    render(currentList());
  }
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch();
  });
  document.getElementById('searchInput').addEventListener('input', (e) => {
    lastQuery = e.target.value.trim().toLowerCase();
    render(currentList());
  });

  loadData();
</script>

</body>
</html>
